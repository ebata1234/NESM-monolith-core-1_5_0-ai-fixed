name: Build mod jar

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Save the finished jar
        uses: actions/upload-artifact@v4
        with:
          name: nesm-protection-lantern-jar
          path: build/libs/*.jar
